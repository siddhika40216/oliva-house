
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Oliva House</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f7f0;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: min(90%, 380px);
            box-sizing: border-box;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h1 { color: #344b35; }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #d9dfd2;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #344b35;
            color: white;
            cursor: pointer;
        }

        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="login-card">
        <p>OLIVA HOUSE</p>
        <h1>Admin Login</h1>
        <p>Sign in to manage customer orders.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label for="password">Admin Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
